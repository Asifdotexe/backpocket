[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "backpocket"
version = "0.2.1"
description = "Just some utilities kept in my backpocket"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "sayyed" }
]
keywords = ["developer-tools", "cleanup", "automation", "cli", "utilities"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.scripts]
backpocket = "backpocket.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/backpocket"]
